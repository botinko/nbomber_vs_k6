[package]
name = "rust-benchmark-app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-web-prom = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
log = "0.4"
prometheus = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
